services:
  - type: web
    name: red-mushroom-web
    runtime: node
    branch: web
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm run web
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: red_mushroom_bot
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_TRUST_PROXY
        value: "true"
